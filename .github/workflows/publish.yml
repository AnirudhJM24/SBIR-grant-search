name: Publish

# Publishes on a version tag (v0.0.1), or on demand to TestPyPI.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in this repo.
# Before the first run, register a pending publisher on PyPI:
#   https://pypi.org/manage/account/publishing/
#     project:  sbirgrantsearch
#     owner:    AnirudhJM24
#     repo:     SBIR-grant-search      (update if the repo is renamed)
#     workflow: publish.yml
#     environment: pypi
# Repeat at https://test.pypi.org/manage/account/publishing/ with
# environment `testpypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"

      - name: Test
        # Never publish something whose tests do not pass.
        run: python -m pytest tests -q

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        # A tag that disagrees with pyproject.toml publishes a version
        # nobody asked for, and PyPI never lets that number be reused.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import sbirgrantsearch; print(sbirgrantsearch.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match version $pkg"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sbirgrantsearch
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sbirgrantsearch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
