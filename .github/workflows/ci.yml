name: CI

on:
  push:
    # Work happens on feature/ and fix/ branches, so they are tested on
    # every push -- not only once a PR exists.
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch naming
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require feature/ or fix/
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/*|fix/*)
              echo "::notice::$BRANCH follows the convention." ;;
            *)
              echo "::error::Branch '$BRANCH' must be named feature/<name> or fix/<name>."
              exit 1 ;;
          esac

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor and ceiling of the supported range on Linux, plus one
        # Windows and one macOS run -- path handling and CSV newline
        # behaviour are where this package is most likely to differ.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        # The suite requires no network; anything that reaches out is a bug.
        run: python -m pytest tests -q

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --quiet dist/*.whl
          /tmp/clean/bin/python -c "import sbirgrantsearch; print(sbirgrantsearch.__version__)"
          /tmp/clean/bin/sbirgrantsearch --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
