name: Publish

# Publishing is driven by the version in pyproject.toml, not by remembering
# to tag. Bump the version, push to main, and this builds, publishes to
# PyPI, tags the commit and opens a GitHub Release.
#
# It is idempotent: if the version is already on PyPI, every job is skipped.
# Pushes that do not change the version therefore do nothing, and re-running
# a workflow cannot double-publish.
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in this repo.
# The pending publisher must be registered first, at
# https://pypi.org/manage/account/publishing/
#   project: sbirgrantsearch     owner: AnirudhJM24
#   repo:    SBIR-grant-search   workflow: publish.yml
#   environment: pypi

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  check:
    name: Is this version new?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_new: ${{ steps.v.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: v
        name: Compare pyproject version against PyPI
        run: |
          set -euo pipefail
          version="$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A 404 means the project has never been published; treat that as
          # new rather than as a failure.
          published="$(curl -sf https://pypi.org/pypi/sbirgrantsearch/json \
            | python -c 'import json,sys; print(" ".join(json.load(sys.stdin)["releases"]))' \
            || echo "")"

          if echo " $published " | grep -q " $version "; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already on PyPI; nothing to publish."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is not on PyPI; publishing."
          fi

  build:
    name: Build and verify
    needs: check
    if: needs.check.outputs.is_new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"

      - name: Test
        # Never publish something whose tests do not pass.
        run: python -m pytest tests -q

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ needs.check.outputs.version }}" ]; then
            echo "::error::tag v$tag does not match version ${{ needs.check.outputs.version }}"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: [check, build]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sbirgrantsearch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: [check, build]
    if: needs.check.outputs.is_new == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sbirgrantsearch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: Tag and release
    needs: [check, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the tag and create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists; nothing to tag."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "sbirgrantsearch $VERSION"
          git push origin "v$VERSION"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists."
            exit 0
          fi
          # Pull this version's section out of the changelog for the notes,
          # falling back to generated notes if it is not there.
          notes="$(python - <<'PY'
          import os, pathlib, re, sys
          # The changelog contains non-ASCII punctuation; never depend on
          # the runner's default stdout encoding for it.
          sys.stdout.reconfigure(encoding="utf-8")
          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)",
              text, re.M | re.S,
          )
          print(match.group(1).strip() if match else "")
          PY
          )"
          if [ -n "$notes" ]; then
            gh release create "v$VERSION" dist/* --title "v$VERSION" --notes "$notes"
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes
          fi
